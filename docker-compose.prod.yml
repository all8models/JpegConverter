services:
  # === 통합 앱 컨테이너 (FastAPI + Celery Worker + Frontend) ===
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: jpg-app
    ports:
      - "80:8000"   # FastAPI가 프론트엔드 정적 파일도 함께 서빙
    volumes:
      - results-data:/tmp/results
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1.5G

  # === Redis (메시지 브로커 + 결과 저장소) ===
  redis:
    image: redis:7-alpine
    container_name: jpg-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  results-data:
  redis-data:
