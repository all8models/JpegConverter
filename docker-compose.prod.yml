services:
  # === FastAPI 백엔드 (Gunicorn + Uvicorn) ===
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: jpg-backend
    expose:
      - "8000"
    volumes:
      - results-data:/tmp/results
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # === Celery Worker ===
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: jpg-worker
    command: celery -A app.tasks.image_tasks.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - results-data:/tmp/results
    env_file: .env
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  # === Redis (메시지 브로커 + 결과 저장소) ===
  redis:
    image: redis:7-alpine
    container_name: jpg-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512M

  # === React 프론트엔드 (Nginx 정적 서빙) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: jpg-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  results-data:
  redis-data:
