version: "3.8"

services:
  # === FastAPI 백엔드 ===
  backend:
    build: ./backend
    container_name: img-compress-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - results-data:/tmp/results  # worker와 공유하는 결과 디렉토리
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - RESULT_DIR=/tmp/results
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # === Celery Worker ===
  worker:
    build: ./backend
    container_name: img-compress-worker
    command: celery -A app.tasks.image_tasks.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - ./backend:/app
      - results-data:/tmp/results  # backend와 공유하는 결과 디렉토리
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - RESULT_DIR=/tmp/results
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # === Celery Beat (스케줄러, 필요시) ===
  # beat:
  #   build: ./backend
  #   container_name: img-compress-beat
  #   command: celery -A app.tasks.image_tasks.celery_app beat --loglevel=info
  #   volumes:
  #     - ./backend:/app
  #   depends_on:
  #     - redis
  #     - minio

  # === Redis (메시지 브로커) ===
  redis:
    image: redis:7-alpine
    container_name: img-compress-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # === MinIO (오브젝트 스토리지) ===
  minio:
    image: minio/minio:latest
    container_name: img-compress-minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console UI
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # === React 프론트엔드 (개발 모드) ===
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: img-compress-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_BACKEND_HOST=backend  # Docker 내부 통신용
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  results-data:
  minio-data:
