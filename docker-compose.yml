version: "3.8"

services:
  # === 통합 앱 컨테이너 (FastAPI + Celery Worker + Frontend) ===
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jpg-app
    ports:
      - "8000:8000"   # FastAPI (프론트엔드 정적 파일도 함께 서빙)
      - "5173:5173"   # Vite Dev Server (HMR)
    volumes:
      - ./backend:/app                # 백엔드 소스 코드 (uvicorn --reload)
      - ./frontend:/frontend          # 프론트엔드 소스 코드 (Vite HMR)
      - /frontend/node_modules        # 컨테이너 node_modules 유지 (익명 볼륨)
      - results-data:/tmp/results
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - STORAGE_BACKEND=local
      - RESULT_DIR=/tmp/results
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # === Redis (메시지 브로커 + 결과 저장소) ===
  redis:
    image: redis:7-alpine
    container_name: jpg-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  results-data:
